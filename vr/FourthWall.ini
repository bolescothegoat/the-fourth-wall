; The Fourth Wall VR - DIAGNOSTIC build 0.1.1. Change only iVRLevel, one step at a time.
;   0 = probe only: logs the environment, touches nothing in the game (START HERE)
;   1 = observe: hooks the face update but only READS; logs headset vs camera positions
;   2 = full: NPCs look at you. Only switches on after an internal safety check passes.
iVRLevel = 2

; Optional: aim at the engine's headset node (HmdNode) instead of the camera root.
; Leave at 0 unless asked; the camera root was confirmed to work. The log compares the two either way.
bVRUseHmdNode = 0

; ---- Ordinary NPCs near you (outside scenes). OFF by default; remove the leading ; to try it. Restart the game after editing. ----
;bNearby = 1            ; also make idle NPCs near you look at you
;fNearbyRadius = 12     ; metres from the headset (default 12)
;iMaxNearby = 5         ; at most this many at once, nearest first (0 = no limit)
;bNearbyOnScreen = 1    ; only characters inside your view (0 = include ones behind you)
