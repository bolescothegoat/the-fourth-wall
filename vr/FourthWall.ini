; The Fourth Wall VR - BETA 0.2.0. Plain key = value lines; restart the game after editing.

; Safety level: 2 = full (default). 1 = observe only (the plugin reads, never writes; use it if something looks wrong).
; 0 = off (logs only, nothing hooked). If the game misbehaves, set 0 and tell me.
iVRLevel = 2

; Who looks at you. In scenes (OStim / SexLab) the scene characters always do.
; Optional: ordinary NPCs near you (outside scenes). OFF by default; remove the leading ; to try it.
;bNearby = 1
;fNearbyRadius = 12     ; metres from the headset
;iMaxNearby = 5         ; at most this many at once, nearest first (0 = no limit)
;bNearbyOnScreen = 1    ; only characters inside your view

; Troubleshooting only (leave off normally):
;bVRProbe = 1           ; log headset / camera positions every few seconds
;bDiag = 1              ; detailed per-character log (large file)
;bVRUseHmdNode = 1      ; aim at the engine's headset node instead of the camera root (same result so far)
